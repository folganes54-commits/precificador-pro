<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Precificador Pro</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <h1>Precificador Pro</h1>
    <div class="top-buttons">
      <button onclick="mostrarLogin()">Login</button>
      <button onclick="mostrarRegister()">Criar Conta</button>
    </div>
  </header>

  <div class="container" id="calculator-container">
    <h2>Calculadora</h2>
    <input id="custo" placeholder="Custo">
    <input id="margem" placeholder="Margem %">
    <button class="btn" onclick="calcular()">Calcular</button>
    <p id="resultado"></p>
  </div>

  <div id="modal-limite" class="modal hidden">
    <div class="modal-content">
      <p>Limite gratuito atingido!</p>
      <p>Para continuar usando, torne-se PRO.</p>
      <button class="btn" onclick="window.location='pro.html'">Virar PRO</button>
    </div>
  </div>

  <div id="login-box" class="modal hidden">
    <div class="modal-content">
      <h3>Login</h3>
      <input id="login-email" placeholder="Email">
      <input id="login-senha" type="password" placeholder="Senha">
      <button class="btn" onclick="login()">Entrar</button>
      <button class="btn secondary" onclick="esconderLogin()">Cancelar</button>
    </div>
  </div>

  <div id="register-box" class="modal hidden">
    <div class="modal-content">
      <h3>Criar Conta</h3>
      <input id="reg-email" placeholder="Email">
      <input id="reg-senha" type="password" placeholder="Senha">
      <button class="btn" onclick="register()">Cadastrar</button>
      <button class="btn secondary" onclick="esconderRegister()">Cancelar</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
